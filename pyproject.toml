[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mprfile"
version = "0.3.0"
description = "Read and analyse Refeyn mass photometry .mpr files (AcquireMP) in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Bernhard Verduijn" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "h5py>=3.10,<4",
    "hdf5plugin>=4.4,<8",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
tiff = ["tifffile>=2023.9.26,<2027"]
notebooks = ["jupyterlab>=4.0,<5", "ipykernel>=6.25,<8", "ipywidgets>=8.1,<9", "ipympl>=0.9.3,<1"]

[project.scripts]
mpr-analyze = "mprfile.cli:main"

[tool.setuptools]
packages = ["mprfile"]
