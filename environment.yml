# Conda environment for reading Refeyn mass photometry (.mpr) files with mprfile.
#
# Create (run from the folder containing this file):
#     conda env create -f environment.yml
#     conda activate mpr
#     jupyter lab            # then open mpr_tutorial.ipynb
#
# Update after changes:   conda env update -f environment.yml --prune
# Remove:                 conda env remove -n mpr
#
# Version policy: every package has a lower bound (oldest supported) and an upper
# bound (next major version, not yet tested), so the solver can't pull in abandoned
# old releases or untested new major releases. Tested set (Sept 2026, Python 3.11):
#   numpy 2.4.6, h5py 3.16.0, hdf5plugin 7.1.0, pandas 3.0.6, scipy 1.17.1,
#   matplotlib 3.11.2, tifffile 2026.3.3, jupyterlab 4.6.4, ipykernel 7.x, ipywidgets 8.1.9
name: mpr
channels:
  - conda-forge
  - nodefaults            # use conda-forge only; don't mix in the Anaconda defaults channel
dependencies:
  - python >=3.11,<3.13
  - numpy >=1.26,<3
  - h5py >=3.10,<4
  - hdf5plugin >=4.4,<8   # Zstandard HDF5 filter used for the movie data
  - pandas >=2.1,<4
  - scipy >=1.11,<2
  - matplotlib >=3.8,<4
  - tifffile >=2023.9.26,<2027   # TIFF export for ImageJ / Fiji (calendar versioning)
  - jupyterlab >=4.0,<5
  - ipykernel >=6.25,<8
  - ipywidgets >=8.1,<9          # interactive frame slider in the tutorial
  - pip >=23,<27
  - pip:
      - -e .              # installs mprfile.py from this folder (editable)
